<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diorama Asset Studio</title>
    <script>
      // Pin a chosen theme before first paint so there is no flash of the system theme.
      try {
        const theme = localStorage.getItem("asset-studio.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        if (localStorage.getItem("asset-studio.style") === "classic") document.documentElement.dataset.style = "classic";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
